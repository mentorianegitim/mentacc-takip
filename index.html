<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentacc Takip - Giriş</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-r from-yellow-700 to-blue-900 min-h-screen flex items-center justify-center">
  <div class="container mx-auto p-4">
    <header class="mb-6 text-center">
      <h1 class="text-3xl font-bold text-white">Mentacc Takip</h1>
      <img src="fox-mascot.png" alt="Tilki Maskot" class="mx-auto mt-4 w-32 h-32 sm:w-40 sm:h-40">
    </header>

    <!-- Hata ve Başarı Mesajları -->
    <div id="error-message" class="hidden bg-red-900 text-white p-3 rounded-lg mb-4"></div>
    <div id="success-message" class="hidden bg-yellow-700 text-black p-3 rounded-lg mb-4"></div>

    <!-- Giriş Formu -->
    <div id="login-form" class="bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
      <h2 class="text-2xl font-semibold mb-4 text-center text-black">Giriş Yap</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <input
          type="text"
          id="emailOrName"
          placeholder="E-posta veya Ad Soyad"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <input
          type="password"
          id="password"
          placeholder="Şifre"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <button
          type="submit"
          class="w-full bg-red-900 text-white p-2 rounded-lg hover:bg-red-800 transition"
        >
          Giriş Yap
        </button>
      </form>
      <p class="mt-4 text-center text-black">
        Hesabın yok mu? 
        <button onclick="showRegisterForm()" class="text-blue-900 hover:underline">Kayıt Ol</button>
      </p>
    </div>

    <!-- Kayıt Formu -->
    <div id="register-form" class="hidden bg-white p-6 rounded-lg shadow-lg max-w-md mx-auto">
      <h2 class="text-2xl font-semibold mb-4 text-center text-black">Kayıt Ol</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <input
          type="text"
          id="firstName"
          placeholder="Ad"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <input
          type="text"
          id="lastName"
          placeholder="Soyad"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <input
          type="text"
          id="profession"
          placeholder="Meslek"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <input
          type="email"
          id="email"
          placeholder="E-posta"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <input
          type="password"
          id="regPassword"
          placeholder="Şifre"
          class="w-full p-2 mb-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-900 text-black"
        />
        <button
          type="submit"
          class="w-full bg-red-900 text-white p-2 rounded-lg hover:bg-red-800 transition"
        >
          Kayıt Ol
        </button>
      </form>
      <p class="mt-4 text-center text-black">
        Zaten hesabın var mı? 
        <button onclick="showLoginForm()" class="text-blue-900 hover:underline">Giriş Yap</button>
      </p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
